<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Terracotta brand tile (matches the PWA icons) -->
  <rect width="32" height="32" rx="8" fill="#c56a4f" />
  <!-- Pixel-art jar: walnut lid, honey body, highlight (16x16 grid, 2px cells) -->
  <g shape-rendering="crispEdges">
    <!-- Lid (walnut 600 #74552f) -->
    <rect x="4" y="4" width="24" height="2" fill="#74552f" />
    <rect x="4" y="6" width="24" height="2" fill="#74552f" />
    <!-- Body (jar 300 #eebc5d) -->
    <rect x="4" y="8" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="10" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="12" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="14" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="16" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="18" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="20" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="22" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="24" width="24" height="2" fill="#eebc5d" />
    <rect x="4" y="26" width="24" height="2" fill="#eebc5d" />
    <!-- Highlight (jar 100 #fbeccb) -->
    <rect x="8" y="12" width="4" height="2" fill="#fbeccb" />
    <rect x="8" y="14" width="4" height="2" fill="#fbeccb" />
    <!-- Base (walnut 600 #74552f) -->
    <rect x="4" y="28" width="24" height="2" fill="#74552f" />
  </g>
</svg>
