# steady — local Supabase configuration.
# Used by `supabase start` / `supabase db reset` in local dev and the CI `rls`
# job. The default ports below match the CI env (SUPABASE_URL=http://127.0.0.1:54321).
# For full docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "steady"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "52428800"

[auth]
enabled = true
# Pin the well-known demo JWT secret so the CI `rls` job's hardcoded demo
# keys (anon/service_role, iss=supabase-demo) validate against the local
# stack. Without this the CLI generates a random secret per `supabase start`
# and the RLS tests fail with "invalid JWT: token signature is invalid".
# Local/CI only — the cloud project uses its own real keys.
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"
# No email verification (username auth mirrors bloom: username@bloom.app).
enable_signup = true
enable_confirmations = false
site_url = "http://127.0.0.1:3000"

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
